name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - test
      - prod

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: echo "Installing dependencies..." # Simulate installation

      - name: Run tests
        run: echo "Running tests..." # Simulate running tests

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        run: echo "Deploying to Dev environment..." # Simulate deployment

  promote-to-test:
    name: Promote Dev to Test
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/dev'
    steps:
    # Checkout the code to ensure we have access to the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    #
      - name: Fetch latest changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git fetch origin
          git checkout test
          git pull origin test 

      - name: Merge Dev into Test
        run: |
          git merge --no-ff dev -m "Auto-merge dev into test"
          git push origin test

#  approve-prod:
#    name: Manual Approval for Prod
#    runs-on: ubuntu-latest
#    needs: promote-to-test
#    if: success() && needs.promote-to-test.result == 'success'
#    steps:
    # Checkout the code to ensure we have access to the repository
#      - name: Checkout code
#        uses: actions/checkout@v4

#      - name: Request auto Approval
#        uses: hmarr/auto-approve-action@v3
#        with:
#          github-token: ${{ secrets.GITHUB_TOKEN }}
#          pull-request-number: ${{ github.event.pull_request.number }} 'uncomment this when a manual approval is needed'

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: promote-to-test
    if: success() && needs.promote-to-test.result == 'success'
    steps:
    # Checkout the code to ensure we have access to the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git fetch origin
          git checkout prod
          git pull origin prod 

      - name: Merge Dev into prod
        run: |
          git merge --no-ff dev -m "Auto-merge dev into prod"
          git push origin prod